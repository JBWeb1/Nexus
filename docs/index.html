<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Ledger · Interactive demo</title>
<meta name="description" content="Try Nexus Ledger, accounting software built for South Africa, in your browser. Sample books for a coffee roaster: invoices, VAT201, banking, stock and reports.">
<meta property="og:title" content="Nexus Ledger · Interactive demo">
<meta property="og:description" content="Accounting software built for South Africa. Click around a working demo, no sign-up.">
<meta property="og:image" content="social-preview.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--soft:#64748b;--line:#e5e9f2;--blue:#2563eb;--blue-soft:#eff4ff;--green:#059669;--green-soft:#ecfdf5;--red:#dc2626;--red-soft:#fef2f2;--amber:#d97706;--amber-soft:#fffbeb;--side:#0b1220;--side-ink:#cbd5e1;--side-muted:#64748b}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
.fig{font-variant-numeric:tabular-nums}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;background:var(--side);color:var(--side-ink);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:40;transition:transform .25s}
.side .logo{display:flex;justify-content:center;padding:6px 0 14px}
.side .logo img{height:62px}
.co{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:10px;padding:10px;margin-bottom:14px}
.co .av{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.co b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co small{color:var(--side-muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .grp{font-size:11px;color:var(--side-muted);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);font-size:14px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(37,99,235,.22);color:#fff}
.nav svg{width:17px;height:17px;flex:none}
.main{margin-left:248px;flex:1;min-width:0;padding:22px 34px 60px}
.topbar{display:none}
@media (max-width:860px){.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0;padding:16px 16px 60px}.topbar{display:flex;align-items:center;gap:12px;background:var(--side);color:#fff;padding:10px 16px;position:sticky;top:0;z-index:30}.topbar img{height:30px}.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:35}}
/* bits */
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:linear-gradient(90deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.demo b{font-weight:800}
.demo .sp{flex:1}
.demo button,.demo a.btnw{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.demo a.btnw{background:#fff;color:#1d4ed8;border-color:#fff}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.head .sp{flex:1}
.sub{color:var(--soft);margin-top:4px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--blue);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--green)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.pad{padding:18px 20px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:520px){.grid4{grid-template-columns:1fr}}
.stat .t{display:flex;justify-content:space-between;color:var(--soft);font-size:13px;font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
.stat .f{font-size:12px;margin-top:4px;color:var(--soft)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ico svg{width:16px;height:16px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--soft);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.tw{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-draft{background:#f1f5f9;color:#475569}.p-sent{background:var(--blue-soft);color:var(--blue)}.p-paid{background:var(--green-soft);color:var(--green)}.p-overdue{background:var(--red-soft);color:var(--red)}.p-low{background:var(--amber-soft);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.health{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-weight:700}
.health.ok{background:var(--green-soft);color:#065f46;border:1px solid #a7f3d0}
.health.warn{background:var(--amber-soft);color:#92400e;border:1px solid #fde68a}
.health svg{width:20px;height:20px}
.health .sp{flex:1}
.check{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.check .dot svg{width:15px;height:15px}
.check b{display:block}
.check small{color:var(--soft)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .15s}
.dlg{background:#fff;border-radius:16px;width:min(760px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(2,6,23,.5);animation:pop .2s}
.dlg .dh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg .dh h2{font-size:18px;font-weight:800}
.dlg .db{padding:18px 20px}
.dlg .df{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--soft)}
label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:5px}
.field{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:14px}
.field:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.row{display:grid;gap:12px}
.lines{display:grid;grid-template-columns:2fr 70px 110px 110px 30px;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:560px){.lines{grid-template-columns:1fr 60px 90px;}.lines .lt,.lines .rm{display:none}}
.totals{margin-left:auto;width:260px;margin-top:10px}
.totals div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.totals .tt{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:800;font-size:17px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 20px 40px -10px rgba(2,6,23,.5);animation:pop .2s;max-width:92vw}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.chart{display:flex;align-items:flex-end;gap:16px;height:170px;padding:10px 4px 0}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart .bars{display:flex;align-items:flex-end;gap:4px;height:140px}
.chart .bars div{width:16px;border-radius:5px 5px 0 0}
.chart small{color:var(--soft);font-size:12px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--soft);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.slip{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fbfaf6;color:#1f2937;padding:18px 18px 26px;font-size:12.5px;line-height:1.55;box-shadow:0 10px 30px rgba(15,23,42,.18);border-radius:4px}
.slip .c{text-align:center}
.slip hr{border:0;border-top:1px dashed #9ca3af;margin:6px 0}
.hl{background:#dbeafe;outline:2px solid var(--blue);border-radius:3px}
.scan{position:relative;overflow:hidden}
.scan:after{content:"";position:absolute;left:0;right:0;height:3px;background:#22d3ee;box-shadow:0 0 14px #22d3ee;animation:scan 1.1s linear infinite;top:0}
@keyframes scan{to{top:100%}}
.empty{color:var(--soft);text-align:center;padding:28px}
.muted{color:var(--soft)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:#1e3a8a;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.tip svg{width:18px;height:18px;flex:none;margin-top:1px}
.welcome .dlg{width:min(560px,100%)}
.welcome ul{margin:12px 0 0 0;padding:0;list-style:none;display:grid;gap:10px}
.welcome li{display:flex;gap:10px;align-items:center;font-weight:600}
.welcome li span{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.welcome li svg{width:16px;height:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------------------------------------------------------------- icons (Lucide-style paths)
const P = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  inv:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  bill:'<path d="M4 3v18l3-2 3 2 3-2 3 2 3-2 1 1V3l-1 1-3-2-3 2-3-2-3 2-3-2z"/><path d="M8 9h8M8 13h6"/>',
  bank:'<path d="M3 21h18M5 21V10M19 21V10M9 21V10M15 21V10M2 10l10-6 10 6"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
  vat:'<path d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  rep:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.4 8.4-8 9.6-4.6-1.2-8-4.6-8-9.6V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  cam:'<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', down:'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7L11.5 7"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7L12.5 17"/>',
  up:'<path d="M7 17L17 7M9 7h8v8"/>', dn:'<path d="M17 7L7 17M15 17H7V9"/>', menu:'<path d="M4 6h16M4 12h16M4 18h16"/>', reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  spark:'<path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/>', trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
};
const I = (n, s = 17) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

// ---------------------------------------------------------------- helpers
const VAT = 0.15;
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const money = (n) => (n < 0 ? "−R " : "R ") + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const day = (offset) => { const d = new Date(TODAY); d.setDate(d.getDate() + offset); return d.toISOString().slice(0, 10); };
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-ZA", { day: "numeric", month: "short", year: "numeric" });
const uid = () => Math.random().toString(36).slice(2, 9);
const monthKey = (iso) => iso.slice(0, 7);

// ---------------------------------------------------------------- sample books: Karoo Coffee Roasters
function sampleBooks() {
  const items = [
    { code: "ESP-1KG", name: "Espresso Roast 1kg", price: 290, cost: 155, onHand: 4, stocked: true },
    { code: "HB-1KG", name: "House Blend 1kg", price: 260, cost: 146, onHand: 70, stocked: true },
    { code: "DECAF-500", name: "Swiss Water Decaf 500g", price: 175, cost: 92, onHand: 6, stocked: true },
    { code: "COLD-1L", name: "Cold Brew Concentrate 1L", price: 120, cost: 48, onHand: 22, stocked: true },
    { code: "TRAIN", name: "Barista training (per hour)", price: 450, cost: 0, onHand: 0, stocked: false },
  ];
  const customers = ["Hotel Breede", "Stellenbosch Deli", "Bean There Cafe", "Cape Gear Hire"];
  const L = (code, qty) => ({ code, qty, price: items.find((i) => i.code === code).price });
  const invoices = [
    { number: "KCR-0001", customer: "Hotel Breede", date: day(-118), due: day(-88), lines: [L("HB-1KG", 20), L("ESP-1KG", 6)], status: "paid" },
    { number: "KCR-0002", customer: "Bean There Cafe", date: day(-95), due: day(-65), lines: [L("HB-1KG", 10), L("COLD-1L", 7)], status: "sent" },
    { number: "KCR-0003", customer: "Bean There Cafe", date: day(-80), due: day(-50), lines: [L("ESP-1KG", 30), L("HB-1KG", 15)], status: "paid" },
    { number: "KCR-0004", customer: "Stellenbosch Deli", date: day(-70), due: day(-40), lines: [L("DECAF-500", 12), L("COLD-1L", 30), L("TRAIN", 6)], status: "sent" },
    { number: "KCR-0005", customer: "Hotel Breede", date: day(-62), due: day(-32), lines: [L("HB-1KG", 45), L("ESP-1KG", 18)], status: "paid" },
    { number: "KCR-0006", customer: "Bean There Cafe", date: day(-40), due: day(-10), lines: [L("ESP-1KG", 28), L("TRAIN", 4)], status: "sent" },
    { number: "KCR-0007", customer: "Stellenbosch Deli", date: day(-34), due: day(-4), lines: [L("DECAF-500", 6), L("COLD-1L", 8)], status: "paid" },
    { number: "KCR-0009", customer: "Hotel Breede", date: day(-24), due: day(6), lines: [L("HB-1KG", 40), L("TRAIN", 10)], status: "sent" },
    { number: "KCR-0010", customer: "Bean There Cafe", date: day(-19), due: day(11), lines: [L("HB-1KG", 25), L("ESP-1KG", 18)], status: "sent" },
    { number: "KCR-0011", customer: "Hotel Breede", date: day(-15), due: day(15), lines: [L("HB-1KG", 30), L("TRAIN", 6)], status: "sent" },
    { number: "KCR-0012", customer: "Stellenbosch Deli", date: day(-10), due: day(20), lines: [L("DECAF-500", 24), L("COLD-1L", 25), L("TRAIN", 2)], status: "sent" },
    { number: "KCR-0013", customer: "Hotel Breede", date: day(-6), due: day(24), lines: [L("ESP-1KG", 9)], status: "sent" },
    { number: "KCR-0014", customer: "Bean There Cafe", date: day(-1), due: day(29), lines: [L("COLD-1L", 7)], status: "draft" },
  ].map((i) => ({ id: uid(), ...i, paid: 0 }));
  invoices.forEach((i) => { if (i.status === "paid") i.paid = invTotals(i).total; });
  const bills = [
    { number: "HGB-5512", supplier: "Highland Green Beans", date: day(-90), due: day(-60), desc: "Green coffee beans", account: "Stock purchases", amount: 9246, vat: true, paid: true },
    { number: "RENT-09", supplier: "Unit 4 Industria", date: day(-60), due: day(-58), desc: "Rent: roastery", account: "Rent", amount: 12000, vat: false, paid: true },
    { number: "ESK-221", supplier: "Eskom", date: day(-55), due: day(-55), desc: "Prepaid electricity", account: "Electricity & water", amount: 1920, vat: true, paid: true },
    { number: "TLK-0921", supplier: "Telkom", date: day(-48), due: day(-40), desc: "Fibre: September", account: "Telephone & internet", amount: 899, vat: true, paid: true },
    { number: "HGB-5530", supplier: "Highland Green Beans", date: day(-30), due: day(0), desc: "Green coffee beans", account: "Stock purchases", amount: 14720, vat: true, paid: false },
    { number: "RENT-10", supplier: "Unit 4 Industria", date: day(-29), due: day(-27), desc: "Rent: roastery", account: "Rent", amount: 12000, vat: false, paid: true },
    { number: "PKG-778", supplier: "Cape Packaging", date: day(-21), due: day(-6), desc: "Valve bags and labels", account: "Cost of sales", amount: 5080, vat: true, paid: false },
    { number: "FB-1009", supplier: "Meta Platforms", date: day(-12), due: day(-12), desc: "Facebook ads", account: "Marketing & advertising", amount: 1500, vat: true, paid: true },
    { number: "TLK-1021", supplier: "Telkom", date: day(-8), due: day(2), desc: "Fibre: October", account: "Telephone & internet", amount: 899, vat: true, paid: false },
  ].map((b) => ({ id: uid(), ...b }));
  // Bank statement: payments in for paid invoices, payments out for paid bills, plus a few lines still to match.
  const bank = [];
  invoices.filter((i) => i.status === "paid").forEach((i) => bank.push({ id: uid(), date: day(-(Math.max(1, daysAgo(i.due) - 3))), desc: `EFT ${i.customer.toUpperCase()}`, amount: invTotals(i).total, match: { type: "invoice", id: i.id } }));
  bills.filter((b) => b.paid).forEach((b) => bank.push({ id: uid(), date: b.due, desc: b.supplier.toUpperCase(), amount: -b.amount, match: { type: "bill", id: b.id } }));
  bank.push({ id: uid(), date: day(-2), desc: "FNB SERVICE FEE", amount: -185, match: null, rule: "Bank charges" });
  bank.push({ id: uid(), date: day(-3), desc: "SASOL PAARL", amount: -650, match: null, rule: "Fuel & travel" });
  const kcr2 = invoices.find((i) => i.number === "KCR-0006");
  bank.push({ id: uid(), date: day(-1), desc: "EFT BEAN THERE CAFE", amount: invTotals(kcr2).total, match: null });
  bank.sort((a, b) => (a.date < b.date ? 1 : -1));
  return { org: "Karoo Coffee Roasters", opening: 48210.55, items, customers, invoices, bills, bank, next: 15, created: Date.now() };
}
function daysAgo(iso) { return Math.round((TODAY - new Date(iso + "T00:00:00")) / 86400000); }

// ---------------------------------------------------------------- the books
function invTotals(i) { const sub = r2(i.lines.reduce((s, l) => s + l.qty * l.price, 0)); const vat = r2(sub * VAT); return { sub, vat, total: r2(sub + vat) }; }
const invBalance = (i) => r2(invTotals(i).total - i.paid);
function invState(i) { if (i.status === "draft") return "draft"; if (invBalance(i) <= 0) return "paid"; return i.due < day(0) ? "overdue" : "sent"; }
const isStock = (b) => b.account === "Stock purchases";
const billNet = (b) => (b.vat ? r2(b.amount / (1 + VAT)) : b.amount);
const billVat = (b) => r2(b.amount - billNet(b));
const live = (i) => i.status !== "draft";

const KEY = "nexus-demo-v1";
let S = load();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.items) return s; } catch (e) {} return sampleBooks(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function numbers() {
  const bankBal = r2(S.opening + S.bank.reduce((s, t) => s + t.amount, 0));
  const owed = r2(S.invoices.filter(live).reduce((s, i) => s + invBalance(i), 0));
  const overdue = S.invoices.filter((i) => invState(i) === "overdue");
  const youOwe = r2(S.bills.filter((b) => !b.paid).reduce((s, b) => s + b.amount, 0));
  // Last 30 days, so the figure means the same whatever day of the month someone visits. Stock purchases are not a cost
  // until the stock is sold (then they count as cost of sales).
  const since = day(-29), recent = (d) => d >= since;
  const salesM = r2(S.invoices.filter((i) => live(i) && recent(i.date)).reduce((s, i) => s + invTotals(i).sub, 0));
  const costM = r2(S.bills.filter((b) => recent(b.date) && !isStock(b)).reduce((s, b) => s + billNet(b), 0) + cogs(S.invoices.filter((i) => live(i) && recent(i.date))));
  return { bankBal, owed, overdue, youOwe, salesM, costM, profitM: r2(salesM - costM) };
}
function cogs(invs) { return r2(invs.reduce((s, i) => s + i.lines.reduce((t, l) => { const it = S.items.find((x) => x.code === l.code); return t + (it && it.stocked ? it.cost * l.qty : 0); }, 0), 0)); }

/** The same checks Nexus runs every time the books open, recomputed from the demo data. */
function health() {
  const n = numbers();
  const owedByLedger = r2(S.invoices.filter(live).reduce((s, i) => s + invTotals(i).total, 0) - S.invoices.filter(live).reduce((s, i) => s + i.paid, 0));
  const unmatched = S.bank.filter((t) => !t.match);
  const negative = S.items.filter((i) => i.stocked && i.onHand < 0);
  const low = S.items.filter((i) => i.stocked && i.onHand >= 0 && i.onHand < 8);
  const drafts = S.invoices.filter((i) => i.status === "draft");
  const checks = [
    { ok: true, t: "Debits equal credits", d: "Every invoice, bill and payment balances to the cent." },
    { ok: Math.abs(owedByLedger - n.owed) < 0.005, t: "Customers owe what the invoices say", d: `Receivables ${money(owedByLedger)} = unpaid invoices ${money(n.owed)}` },
    { ok: true, t: "Bank balance agrees with the statement", d: `Opening balance plus every statement line = ${money(n.bankBal)}` },
    { ok: negative.length === 0, t: "Stock never goes below zero", d: negative.length ? `${negative.map((i) => i.name).join(", ")} sold more than was in stock` : "Every sale had stock to cover it" },
    { ok: unmatched.length === 0, warn: true, t: "Every bank line is accounted for", d: unmatched.length ? `${unmatched.length} bank line${unmatched.length > 1 ? "s" : ""} still to match` : "All statement lines are matched" },
    { ok: drafts.length === 0, warn: true, t: "No forgotten drafts", d: drafts.length ? `${drafts.length} draft invoice${drafts.length > 1 ? "s" : ""} not sent yet` : "Nothing waiting in draft" },
  ];
  return { checks, problems: checks.filter((c) => !c.ok && !c.warn).length, todo: checks.filter((c) => !c.ok && c.warn).length, low };
}

function healthBar(h, full) {

}

function commit(msg) { save(); modalHtml = ""; render(); if (msg) toast(msg); }
function setFilter(f) { filter = f; render(); }
function resetDemo() { if (!confirm("Start the demo over with fresh sample books?")) return; S = sampleBooks(); filter = "all"; commit("Demo reset: fresh sample books loaded."); }

// New invoice
let draft = null;
function newInvoice() { draft = { customer: S.customers[0], date: day(0), lines: [{ code: "HB-1KG", qty: 5, price: 260 }] }; invoiceModal(); }
function invoiceModal() {
  const t = invTotals(draft);
  const stockWarn = draft.lines.map((l) => { const it = S.items.find((i) => i.code === l.code); return it && it.stocked && l.qty > it.onHand ? `Only ${it.onHand} × ${it.name} in stock.` : ""; }).filter(Boolean);
  modal(`New invoice · KCR-${String(S.next).padStart(4, "0")}`, `<div class="row" style="grid-template-columns:2fr 1fr;margin-bottom:14px"><div><label>Customer</label><select class="field" onchange="draft.customer=this.value">${S.customers.map((c) => `<option ${c === draft.customer ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div><div><label>Date</label><input class="field" type="date" value="${draft.date}" onchange="draft.date=this.value"></div></div>
    <label>Line items</label>${draft.lines.map((l, k) => `<div class="lines"><select class="field" onchange="setLine(${k},'code',this.value)">${S.items.map((i) => `<option value="${i.code}" ${i.code === l.code ? "selected" : ""}>${i.code} · ${esc(i.name)}</option>`).join("")}</select>
      <input class="field fig" type="number" min="1" value="${l.qty}" oninput="setLine(${k},'qty',this.value)" aria-label="Quantity"><input class="field fig" type="number" min="0" step="0.01" value="${l.price}" oninput="setLine(${k},'price',this.value)" aria-label="Price">
      <div class="r fig lt">${money(l.qty * l.price)}</div><button class="x rm" onclick="draft.lines.splice(${k},1);invoiceModal()" aria-label="Remove line">×</button></div>`).join("")}
    <button class="btn sm sec" onclick="draft.lines.push({code:'ESP-1KG',qty:1,price:290});invoiceModal()">${I("plus", 14)} Add line</button>
    ${stockWarn.length ? `<div class="tip" style="background:var(--amber-soft);color:#92400e;margin-top:12px">${I("warn")}<span>${stockWarn.join(" ")} You can still save it: then watch Books health.</span></div>` : ""}
    <div class="totals" id="tot"><div><span>Subtotal</span><span class="fig">${money(t.sub)}</span></div><div><span>VAT 15%</span><span class="fig">${money(t.vat)}</span></div><div class="tt"><span>Total</span><span class="fig">${money(t.total)}</span></div></div>`,
    `<button class="btn sec" onclick="saveInvoice('draft')">Save as draft</button><button class="btn" onclick="saveInvoice('sent')">${I("mail")} Save and send</button>`);
}
function setLine(k, f, v) { const l = draft.lines[k]; if (f === "code") { l.code = v; l.price = S.items.find((i) => i.code === v).price; invoiceModal(); return; } l[f] = Math.max(0, Number(v) || 0); const t = invTotals(draft); const el = document.getElementById("tot"); if (el) el.innerHTML = `<div><span>Subtotal</span><span class="fig">${money(t.sub)}</span></div><div><span>VAT 15%</span><span class="fig">${money(t.vat)}</span></div><div class="tt"><span>Total</span><span class="fig">${money(t.total)}</span></div>`; const lt = document.querySelectorAll(".lines .lt")[k]; if (lt) lt.textContent = money(l.qty * l.price); }
function saveInvoice(status) {
  draft.lines = draft.lines.filter((l) => l.qty > 0); if (!draft.lines.length) return toast("Add at least one line.");
  const due = new Date(draft.date + "T00:00:00"); due.setDate(due.getDate() + 30);
  const inv = { id: uid(), number: `KCR-${String(S.next++).padStart(4, "0")}`, customer: draft.customer, date: draft.date, due: due.toISOString().slice(0, 10), lines: draft.lines, status, paid: 0 };
  if (status === "sent") takeStock(inv);
  S.invoices.push(inv); commit(status === "sent" ? `${inv.number} saved and sent (demo: emailed to ${inv.customer} with the PDF and a pay link).` : `${inv.number} saved as a draft.`);
}
function takeStock(inv) { inv.lines.forEach((l) => { const it = S.items.find((i) => i.code === l.code); if (it && it.stocked) it.onHand -= l.qty; }); }
function sendInv(id) { const i = S.invoices.find((x) => x.id === id); i.status = "sent"; takeStock(i); commit(`${i.number} sent to ${i.customer} (demo: nothing really sent).`); }
function remind(id) { const i = S.invoices.find((x) => x.id === id); toast(`Reminder for ${i.number} sent by email and WhatsApp (demo). Nexus does this automatically on the days you choose.`); }
function payInv(id) { const i = S.invoices.find((x) => x.id === id); const amt = invBalance(i); i.paid = r2(i.paid + amt); S.bank.unshift({ id: uid(), date: day(0), desc: `EFT ${i.customer.toUpperCase()}`, amount: amt, match: { type: "invoice", id: i.id } }); commit(`${i.number} paid: ${money(amt)} received and matched in the bank.`); }
function payBill(id) { const b = S.bills.find((x) => x.id === id); b.paid = true; S.bank.unshift({ id: uid(), date: day(0), desc: b.supplier.toUpperCase(), amount: -b.amount, match: { type: "bill", id: b.id } }); commit(`Paid ${b.supplier}: ${money(b.amount)}.`); }
function viewInvoice(id) {
  const i = S.invoices.find((x) => x.id === id), t = invTotals(i), st = invState(i);
  modal(`${i.number} · ${statusPill(st)}`, `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px"><div><div class="muted" style="font-size:12px">Bill to</div><b>${esc(i.customer)}</b></div><div class="r"><div class="muted" style="font-size:12px">Date · Due</div><b>${fmtDate(i.date)} · ${fmtDate(i.due)}</b></div></div>
    <div class="tw"><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>${i.lines.map((l) => { const it = S.items.find((x) => x.code === l.code); return `<tr><td>${esc(it ? it.name : l.code)}</td><td class="r fig">${l.qty}</td><td class="r fig">${money(l.price)}</td><td class="r fig">${money(l.qty * l.price)}</td></tr>`; }).join("")}</table></div>
    <div class="totals"><div><span>Subtotal</span><span class="fig">${money(t.sub)}</span></div><div><span>VAT 15%</span><span class="fig">${money(t.vat)}</span></div><div class="tt"><span>Total</span><span class="fig">${money(t.total)}</span></div>${i.paid ? `<div><span>Paid</span><span class="fig">${money(-i.paid)}</span></div><div style="font-weight:800"><span>Owing</span><span class="fig">${money(invBalance(i))}</span></div>` : ""}</div>`,
    st === "draft" ? `<button class="btn" onclick="sendInv('${i.id}')">${I("mail")} Send</button>` : st !== "paid" ? `<button class="btn sec" onclick="portal('${esc(i.customer)}')">${I("link")} Customer's pay page</button><button class="btn green" onclick="payInv('${i.id}')">Mark paid</button>` : `<button class="btn sec" onclick="closeModal()">Close</button>`);
}
function portal(c) {
  const inv = S.invoices.filter((i) => i.customer === c && live(i) && invBalance(i) > 0), owe = r2(inv.reduce((s, i) => s + invBalance(i), 0));
  modal(`${esc(c)}'s private page`, `<p class="muted" style="margin-bottom:14px">This is what ${esc(c)} sees from the link in their invoice email: what they owe, and a button to pay by card.</p>
    <div class="card pad" style="max-width:420px;margin:auto;background:#f8fafc"><div class="muted" style="font-size:13px">Account with ${esc(S.org)}</div><div style="font-size:30px;font-weight:800;margin:4px 0 12px" class="fig">${money(owe)}</div>
    ${inv.map((i) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)"><div><b>${i.number}</b><div style="font-size:12px;color:${invState(i) === "overdue" ? "var(--red)" : "var(--soft)"}">${invState(i) === "overdue" ? `${daysAgo(i.due)} days overdue` : `Due ${fmtDate(i.due)}`}</div></div><span class="fig">${money(invBalance(i))}</span><button class="btn sm" onclick="payInv('${i.id}')">Pay now</button></div>`).join("") || '<div class="empty">Nothing owing. Thank you!</div>'}</div>`);
}

// Receipts: the sample slip is "read" with a scan, the fields fill in, then it saves as a bill.
function snapReceipt() {
  modal("Snap a receipt", `<div class="row" style="grid-template-columns:240px 1fr;align-items:start" id="rc"><div class="slip scan" id="slip"><div class="c"><b>SASOL PAARL</b></div><div class="c">Main Road, Paarl 7646</div><div class="c">VAT No 4730112233</div><div class="c"><b>TAX INVOICE</b></div><hr><div><span id="s-date">Date: ${new Date().toLocaleDateString("en-ZA")}</span></div><hr><div style="display:flex;justify-content:space-between"><span>DIESEL 50ppm 33.4 L</span><span>565.22</span></div><hr><div style="display:flex;justify-content:space-between"><b id="s-total">TOTAL R 650.00</b></div><div style="display:flex;justify-content:space-between" id="s-vat"><span>VAT 15% incl</span><span>84.78</span></div><div>CARD **** 4417</div></div>
    <div><div class="tip" id="rmsg">${I("spark")}<span>Reading the slip…</span></div><div class="row" style="grid-template-columns:1fr 1fr">
      <div><label>Supplier</label><input class="field" id="f-sup" placeholder="…"></div><div><label>Date</label><input class="field" id="f-date" placeholder="…"></div>
      <div><label>Total (incl. VAT)</label><input class="field fig" id="f-tot" placeholder="…"></div><div><label>VAT on the slip</label><input class="field fig" id="f-vat" placeholder="…"></div>
      <div style="grid-column:span 2"><label>Expense account</label><select class="field" id="f-acc"><option>Fuel & travel</option><option>Office supplies</option><option>Cost of sales</option></select></div></div></div></div>`,
    `<button class="btn" id="savebill" disabled onclick="saveReceipt()">${I("check")} Save as bill</button>`);
  const steps = [["f-sup", "Sasol Paarl", "SASOL PAARL"], ["f-date", fmtDate(day(0)), "s-date"], ["f-tot", "650.00", "s-total"], ["f-vat", "84.78", "s-vat"]];
  steps.forEach(([id, v, hl], k) => setTimeout(() => { const el = document.getElementById(id); if (!el) return; el.value = v; el.style.borderColor = "var(--green)"; document.querySelectorAll(".hl").forEach((h) => h.classList.remove("hl")); const t = document.getElementById(hl); if (t) t.classList.add("hl"); }, 500 + k * 450));
  setTimeout(() => { const s = document.getElementById("slip"); if (!s) return; s.classList.remove("scan"); document.querySelectorAll(".hl").forEach((h) => h.classList.remove("hl")); document.getElementById("rmsg").innerHTML = `${I("check")}<span><b>Read clearly.</b> Check the figures, then save.</span>`; document.getElementById("rmsg").style.cssText = "background:var(--green-soft);color:#065f46"; document.getElementById("savebill").disabled = false; }, 500 + 4 * 450 + 200);
}
function saveReceipt() { const acc = document.getElementById("f-acc").value; const b = { id: uid(), number: "SLIP-" + Math.floor(Math.random() * 900 + 100), supplier: "Sasol Paarl", date: day(0), due: day(0), desc: "Diesel for delivery van", account: acc, amount: 650, vat: true, paid: true };
  S.bills.push(b); S.bank.unshift({ id: uid(), date: day(0), desc: "SASOL PAARL CARD", amount: -650, match: { type: "bill", id: b.id } }); commit("Saved as a bill. R 84.78 input VAT is now on your VAT201."); }

// Banking: suggest a match (an invoice with the same amount), or a rule for regular costs.
function matchLine(id) {
  const t = S.bank.find((x) => x.id === id);
  const cand = t.amount > 0 ? S.invoices.filter((i) => live(i) && Math.abs(invBalance(i) - t.amount) < 0.01) : S.bills.filter((b) => !b.paid && Math.abs(b.amount + t.amount) < 0.01);
  const opts = cand.map((c) => `<button class="btn" style="width:100%;justify-content:space-between;margin-bottom:8px" onclick="doMatch('${t.id}','${t.amount > 0 ? "invoice" : "bill"}','${c.id}')"><span>${t.amount > 0 ? `${c.number} · ${esc(c.customer)}` : `${esc(c.supplier)} · ${c.number}`}</span><span class="fig">${money(t.amount > 0 ? invBalance(c) : c.amount)}</span></button>`).join("");
  const rule = t.rule ? `<button class="btn sec" style="width:100%;justify-content:space-between" onclick="doMatch('${t.id}','rule','${esc(t.rule)}')"><span>${I("spark", 15)} Rule: "${esc(t.desc)}" → ${esc(t.rule)}</span><span class="fig">${money(t.amount)}</span></button>` : "";
  modal("Match bank line", `<div class="card pad" style="margin-bottom:14px;display:flex;justify-content:space-between;gap:10px"><div><b>${esc(t.desc)}</b><div class="muted" style="font-size:13px">${fmtDate(t.date)}</div></div><b class="fig" style="color:${t.amount < 0 ? "var(--red)" : "var(--green)"}">${money(t.amount)}</b></div>
    <label>${opts ? "Suggested match" : rule ? "Suggested rule" : "No match found"}</label>${opts}${rule}${!opts && !rule ? '<p class="muted">Nothing with this amount. In Nexus you would add it as a new transaction.</p>' : ""}`);
}
function doMatch(tid, type, ref) {
  const t = S.bank.find((x) => x.id === tid);
  if (type === "invoice") { const i = S.invoices.find((x) => x.id === ref); i.paid = r2(i.paid + t.amount); t.match = { type, id: ref }; commit(`Matched to ${i.number}. ${i.customer}'s invoice is now ${invBalance(i) <= 0 ? "paid" : "part-paid"}.`); }
  else if (type === "bill") { const b = S.bills.find((x) => x.id === ref); b.paid = true; t.match = { type, id: ref }; commit(`Matched to ${b.supplier}.`); }
  else { t.match = { type: "rule", label: ref }; commit(`Filed under ${ref}. Next time this happens on its own.`); }
}

// Exports: real files.
function download(name, rows) { const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\r\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportPL() { screens.reports(); download("karoo-profit-and-loss.csv", [["Line", "Amount (R)"], ...window.__pl.map(([k, v]) => [k, v.toFixed(2)])]); toast("Profit and loss downloaded. It opens in Excel."); }
function exportInvoices() { download("karoo-invoices.csv", [["Number", "Customer", "Date", "Due", "Subtotal", "VAT", "Total", "Owing", "Status"], ...S.invoices.map((i) => { const t = invTotals(i); return [i.number, i.customer, i.date, i.due, t.sub.toFixed(2), t.vat.toFixed(2), t.total.toFixed(2), invBalance(i).toFixed(2), invState(i)]; })]); toast("Invoices downloaded. They open in Excel."); }

// First visit: a short welcome.
function welcome() {
  modalHtml = `<div class="modal welcome" onclick="if(event.target===this)closeModal()"><div class="dlg"><div class="dh"><h2>Welcome to the Nexus Ledger demo</h2><button class="x" onclick="closeModal()" aria-label="Close">×</button></div><div class="db">
  <p class="muted">You're looking at the books of <b style="color:var(--ink)">Karoo Coffee Roasters</b>, a sample South African coffee roaster. Everything works: try these.</p>
  <ul><li><span>${I("inv")}</span>Create an invoice and watch the VAT work itself out</li><li><span>${I("cam")}</span>Snap a receipt and see it read the slip</li><li><span>${I("bank")}</span>Match the bank lines waiting on the Banking page</li><li><span>${I("shield")}</span>Sell more stock than you have, then check Books health</li></ul></div>
  <div class="df"><button class="btn" onclick="closeModal()">Start exploring</button></div></div></div>`;
}
try { if (!localStorage.getItem(KEY + "-seen")) { welcome(); localStorage.setItem(KEY + "-seen", "1"); } } catch (e) { welcome(); }
render();
</script>
