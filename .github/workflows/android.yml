name: Android app

# Builds the Nexus Android app (APK) that opens your hosted Nexus site full-screen.
# Run it from Actions > Android app > Run workflow, with the address of your live site.
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (see DEPLOY.md). Without them a test build is made with a temporary key.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Address of your live Nexus site, e.g. https://books.example.co.za'
        required: true
        default: 'https://nexus-ledger.vercel.app'
  push:
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexus.jks" >> "$GITHUB_ENV"
            echo "Signing with the Nexus key from repository secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this is a test build signed with a temporary key. Phones will not update it to a properly signed build."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_URL: ${{ inputs.app_url || 'https://nexus-ledger.vercel.app' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gradle -p android assembleRelease --no-daemon -PappUrl="$APP_URL" -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p dist && cp android/app/build/outputs/apk/release/app-release.apk "dist/nexus-ledger-$VERSION.apk"
      - name: Signing fingerprint (for ANDROID_CERT_SHA256 on your site)
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          FP="$("$APKSIGNER" verify --print-certs dist/*.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F)"
          { echo "### Nexus Ledger APK"; echo; echo "Opens: \`${{ inputs.app_url || 'https://nexus-ledger.vercel.app' }}\`"; echo;
            echo "Set this on your site so the app opens full-screen: \`ANDROID_CERT_SHA256=$FP\`"; } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $FP"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ledger-apk
          path: dist/*.apk
          if-no-files-found: error
