name: Desktop apps

# Builds the Nexus Ledger desktop apps that open your hosted Nexus site in their own window: a Windows installer (.exe)
# and a Mac disk image (.dmg). Run it from Actions > Desktop apps > Run workflow, with the address of your live site.
# A manual run also publishes both to the "apps" release, which your site's /download page links to; every run keeps
# them under the run's Artifacts too. Optional code signing (removes the SmartScreen warning): add repository secrets
# WINDOWS_CERT_BASE64 (a .pfx code-signing certificate) and WINDOWS_CERT_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Address of your live Nexus site, e.g. https://books.example.co.za'
        required: true
        default: 'https://nexus-ledger.vercel.app'
      publish:
        description: 'Put the file on the public download page (the "apps" release)'
        type: boolean
        default: true
  push:
    paths: ['desktop/**', '.github/workflows/windows.yml']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Site address and version
        env:
          APP_URL: ${{ inputs.app_url || 'https://nexus-ledger.vercel.app' }}
        run: |
          case "$APP_URL" in https://*) ;; *) echo "::error::The site address must start with https://"; exit 1;; esac
          VERSION=$(node -p "require('../package.json').version")
          node -e "require('fs').writeFileSync('app/app-config.json', JSON.stringify({ appUrl: process.argv[1] }, null, 2))" "$APP_URL"
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Nexus Ledger $VERSION for $APP_URL"
      - name: Signing certificate
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/nexus.pfx"
            echo "CSC_LINK=$RUNNER_TEMP/nexus.pfx" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the certificate from repository secrets."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::No WINDOWS_CERT_BASE64 secret: the installer is not code-signed, so Windows SmartScreen will warn before installing (More info > Run anyway)."
          fi
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Summary
        run: |
          ls -la dist/*.exe
          echo "### Nexus Ledger $VERSION for Windows" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **nexus-ledger-windows** under Artifacts, unzip it and run \`Nexus-Ledger-Setup-$VERSION.exe\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ledger-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish to the download page
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release, "apps", holds the latest installers under fixed names, so download links never change.
          # It is a pre-release, so it never counts as the newest Nexus version in Settings > Updates.
          gh release view apps --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create apps --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Ledger apps" --prerelease --latest=false \
            --notes "The Nexus Ledger apps for Windows, Mac and Android. Each one opens your live Nexus site. Download them from your site's /download page."
          cp dist/*.exe "$RUNNER_TEMP/Nexus-Ledger-Setup.exe"
          gh release upload apps "$RUNNER_TEMP/Nexus-Ledger-Setup.exe#Windows installer (.exe)" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/apps/Nexus-Ledger-Setup.exe" >> "$GITHUB_STEP_SUMMARY"

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Site address and version
        env:
          APP_URL: ${{ inputs.app_url || 'https://nexus-ledger.vercel.app' }}
        run: |
          case "$APP_URL" in https://*) ;; *) echo "::error::The site address must start with https://"; exit 1;; esac
          VERSION=$(node -p "require('../package.json').version")
          node -e "require('fs').writeFileSync('app/app-config.json', JSON.stringify({ appUrl: process.argv[1] }, null, 2))" "$APP_URL"
          npm pkg set version="$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build (not signed by Apple)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          echo "::warning::The Mac app is not signed or notarised by Apple, so the first time it opens the Mac asks for permission (see DEPLOY.md)."
          npx electron-builder --mac dmg --universal --publish never -c.mac.identity=-
          ls -la dist/*.dmg
          echo "### Nexus Ledger $VERSION for Mac" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-ledger-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error
      - name: Publish to the download page
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release, "apps", holds the latest installers under fixed names, so download links never change.
          # It is a pre-release, so it never counts as the newest Nexus version in Settings > Updates.
          gh release view apps --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create apps --repo "$GITHUB_REPOSITORY" \
            --title "Nexus Ledger apps" --prerelease --latest=false \
            --notes "The Nexus Ledger apps for Windows, Mac and Android. Each one opens your live Nexus site. Download them from your site's /download page."
          cp dist/*.dmg "$RUNNER_TEMP/Nexus-Ledger-Mac.dmg"
          gh release upload apps "$RUNNER_TEMP/Nexus-Ledger-Mac.dmg#Mac app (.dmg)" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/download/apps/Nexus-Ledger-Mac.dmg" >> "$GITHUB_STEP_SUMMARY"
