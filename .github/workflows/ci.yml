name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API: http://localhost:3000
      PAYSTACK_SECRET_KEY: sk_test_regression
      DISABLE_RATE_LIMIT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Create database and apply migrations
        run: npm run setup
      - run: npm run build
      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "Server did not start"; cat server.log; exit 1
      - name: Regression tests
        # npm test reads .env itself; the suite also needs the owner connection for its database checks.
        env:
          ADMIN_DATABASE_URL: postgres://postgres:devpassword@localhost:5432/nexus_ledger
        run: npm test
      - name: Server log
        if: failure()
        run: cat server.log
